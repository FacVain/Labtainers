# DGA simulator settings (DGA_SEED is set by parameterization)
DGA_SEED=DGA_SEED_TOKEN
DGA_MODE=random
# lookups per minute (rate sweep in the experiments: 2, 10, 30, 60)
DGA_RATE=30
# seconds after boot before the infection starts
DGA_START_DELAY=120
RESOLVER=172.30.0.10
# keep running after the C2 name resolved (beacon re-checks every 60 s)
DGA_KEEP_ALIVE=yes

# client3 also has a normal user on it (so it is not "only malware")
BENIGN_PROFILE=browse
THINK_MIN=8
THINK_MAX=40
